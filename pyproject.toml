[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milo"
dynamic = ["version"]
description = "Terminal marketing-research agent for restaurants and food businesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/nikhil-kunapareddy/milo"
Repository = "https://github.com/nikhil-kunapareddy/milo"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
milo = "milo.cli:app"

[tool.hatch.version]
path = "milo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["milo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]  # the UI uses – and … on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
